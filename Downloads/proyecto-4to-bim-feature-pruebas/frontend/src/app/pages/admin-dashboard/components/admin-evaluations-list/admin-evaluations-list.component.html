<div class="admin-container">
    <div class="header-actions"
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Administración de Evaluaciones</h2>
        <div>
            <a routerLink="/home" class="btn btn-secondary" style="margin-right: 10px;">Volver al inicio</a>
            <button class="btn btn-primary" (click)="loadEvaluaciones()">Actualizar</button>
        </div>
    </div>

    <!-- Estado de Carga -->
    <div *ngIf="loading" class="state-container" style="text-align: center; padding: 20px;">
        <p>Cargando evaluaciones...</p>
    </div>

    <!-- Mensaje de Error -->
    <div *ngIf="error && !loading" class="state-container error" style="color: red; text-align: center; padding: 20px;">
        <p>{{ error }}</p>
    </div>

    <!-- Contenido de la Tabla -->
    <div *ngIf="!loading && !error">
        <table *ngIf="evaluaciones.length > 0; else noData" class="data-table"
            style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background-color: #f4f4f4; text-align: left;">
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Nombre</th>
                    <th style="padding: 10px;">Categoría</th>
                    <th style="padding: 10px;">Empresa ID</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let ev of evaluaciones" style="border-bottom: 1px solid #ddd;">
                    <td style="padding: 10px;">{{ ev.evaluacion_id }}</td>
                    <td style="padding: 10px;">{{ ev.evaluacion_nombre }}</td>
                    <td style="padding: 10px;">{{ ev.categoria || 'Sin categoría' }}</td>
                    <td style="padding: 10px;">{{ ev.empresa_id }}</td>
                </tr>
            </tbody>
        </table>

        <!-- Si no hay datos registrados -->
        <ng-template #noData>
            <div class="state-container empty" style="text-align: center; padding: 20px;">
                <p>No hay evaluaciones almacenadas en la base de datos.</p>
            </div>
        </ng-template>
    </div>
</div>

<form class="notification-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
        <label for="usuario_id_admin">ID del usuario</label>
        <input id="usuario_id_admin" type="number" formControlName="usuario_id" placeholder="Ej. 7">
    </div>

    <div class="field">
        <label for="titulo_admin">Título</label>
        <input id="titulo_admin" type="text" formControlName="titulo" placeholder="Ej. Aviso importante">
    </div>

    <div class="field">
        <label for="tipo_admin">Tipo</label>
        <input id="tipo_admin" type="text" formControlName="tipo" placeholder="Ej. Informativo">
    </div>

    <div class="field">
        <label for="descripcion_admin">Descripción</label>
        <textarea id="descripcion_admin" rows="4" formControlName="descripcion"
            placeholder="Ej. Se ha actualizado el proceso de revisión."></textarea>
    </div>

    <label class="checkbox-row">
        <input type="checkbox" formControlName="estado" />
        Marcar como leída
    </label>

    <button type="submit" class="btn-primary" [disabled]="sending || form.invalid">
        {{ sending ? 'Enviando...' : 'Enviar' }}
    </button>

    <p class="message success" *ngIf="successMessage">{{ successMessage }}</p>
    <p class="message error" *ngIf="errorMessage">{{ errorMessage }}</p>
</form>

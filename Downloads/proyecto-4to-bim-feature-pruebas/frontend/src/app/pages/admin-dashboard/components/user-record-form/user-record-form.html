<section class="user-record-container">
  <div class="record-card">
    <div class="record-header">
      <h2>Registro del usuario</h2>
      <p>Actualiza los datos personales del usuario.</p>
    </div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="row two-columns">
        <div class="field-group">
          <label for="usuario_nombre">Nombre</label>
          <input id="usuario_nombre" formControlName="usuario_nombre" type="text" placeholder="Nombre" />
          <small class="error"
            *ngIf="userForm.get('usuario_nombre')?.touched && userForm.get('usuario_nombre')?.invalid">
            El nombre es obligatorio.
          </small>
        </div>

        <div class="field-group">
          <label for="usuario_apellido">Apellido</label>
          <input id="usuario_apellido" formControlName="usuario_apellido" type="text" placeholder="Apellido" />
          <small class="error"
            *ngIf="userForm.get('usuario_apellido')?.touched && userForm.get('usuario_apellido')?.invalid">
            El apellido es obligatorio.
          </small>
        </div>
      </div>

      <div class="row two-columns">
        <div class="field-group">
          <label for="usuario_correo">Correo</label>
          <input id="usuario_correo" formControlName="usuario_correo" type="email" placeholder="correo@ejemplo.com" />
          <small class="error"
            *ngIf="userForm.get('usuario_correo')?.touched && userForm.get('usuario_correo')?.invalid">
            Ingrese un correo válido.
          </small>
        </div>

        <div class="field-group">
          <label for="usuario_profesion">Profesión</label>
          <input id="usuario_profesion" formControlName="usuario_profesion" type="text" placeholder="Profesión" />
        </div>
      </div>

      <div class="row two-columns">
        <div class="field-group">
          <label for="usuario_telefono">Teléfono</label>
          <input id="usuario_telefono" formControlName="usuario_telefono" type="text" placeholder="Teléfono" />
        </div>

        <div class="field-group">
          <label for="usuario_dpi">DPI</label>
          <input id="usuario_dpi" formControlName="usuario_dpi" type="text" placeholder="DPI" />
        </div>
      </div>

      <div class="error-banner" *ngIf="serverError">
        {{ serverError }}
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="submitting">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="submitting">
          {{ submitting ? 'Guardando...' : 'Guardar registro' }}
        </button>
      </div>
    </form>
  </div>
</section>

<section class="question-form-shell">
    <div class="form-card">
        <div class="form-header">
            <p class="eyebrow">Empresa</p>
            <h2>Nueva pregunta</h2>
        </div>

        <form [formGroup]="questionForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="field-group">
                <label for="pregunta">Pregunta</label>
                <textarea id="pregunta" rows="3" formControlName="pregunta"
                    placeholder="Escribe la pregunta"></textarea>
                <small class="error"
                    *ngIf="questionForm.get('pregunta')?.touched && questionForm.get('pregunta')?.invalid">
                    La pregunta es obligatoria.
                </small>
            </div>

            <div class="field-group">
                <label for="categoria">Categoría</label>
                <input id="categoria" type="text" formControlName="categoria" placeholder="Ej. Frontend" />
                <small class="error"
                    *ngIf="questionForm.get('categoria')?.touched && questionForm.get('categoria')?.invalid">
                    La categoría es obligatoria.
                </small>
            </div>

            <div class="options-grid">
                <div class="field-group">
                    <label for="opcion_1">Opción 1</label>
                    <input id="opcion_1" type="text" formControlName="opcion_1" />
                </div>
                <div class="field-group">
                    <label for="opcion_2">Opción 2</label>
                    <input id="opcion_2" type="text" formControlName="opcion_2" />
                </div>
                <div class="field-group">
                    <label for="opcion_3">Opción 3</label>
                    <input id="opcion_3" type="text" formControlName="opcion_3" />
                </div>
                <div class="field-group">
                    <label for="opcion_4">Opción 4</label>
                    <input id="opcion_4" type="text" formControlName="opcion_4" />
                </div>
            </div>

            <div class="field-group">
                <label for="respuesta_correcta">Respuesta correcta</label>
                <input id="respuesta_correcta" type="text" formControlName="respuesta_correcta"
                    placeholder="Debe coincidir exactamente con una opción" />
                <small class="error"
                    *ngIf="questionForm.get('respuesta_correcta')?.touched && questionForm.get('respuesta_correcta')?.invalid">
                    Debes definir la respuesta correcta.
                </small>
            </div>

            <div class="error-banner" *ngIf="serverError">
                {{ serverError }}
            </div>

            <div class="actions">
                <button type="button" class="btn btn-secondary" (click)="onCancel()"
                    [disabled]="submitting">Cancelar</button>
                <button type="submit" class="btn btn-primary" [disabled]="submitting">
                    {{ submitting ? 'Guardando...' : 'Guardar pregunta' }}
                </button>
            </div>
        </form>
    </div>
</section>

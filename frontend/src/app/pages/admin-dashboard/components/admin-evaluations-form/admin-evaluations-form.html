<form [formGroup]="evaluationForm" (ngSubmit)="onSubmit()" class="form-container">
    <h2>{{ evaluacionToEdit ? 'Editar Evaluación' : 'Nueva Evaluación' }}</h2>

    <div class="form-group">
        <label for="evaluacion_nombre">Nombre de la Evaluación *</label>
        <input id="evaluacion_nombre" type="text" formControlName="evaluacion_nombre"
            placeholder="Ej. Evaluación de JavaScript" />
        <span class="error"
            *ngIf="evaluationForm.get('evaluacion_nombre')?.touched && evaluationForm.get('evaluacion_nombre')?.invalid">
            El nombre de la evaluación es obligatorio (máx. 100 caracteres).
        </span>
    </div>

    <div class="form-group">
        <label for="categoria">Categoría</label>
        <input id="categoria" type="text" formControlName="categoria" placeholder="Ej. Frontend, Backend, RRHH" />
        <span class="error"
            *ngIf="evaluationForm.get('categoria')?.touched && evaluationForm.get('categoria')?.invalid">
            La categoría no puede superar 100 caracteres.
        </span>
    </div>

    <div class="form-group">
        <label for="empresa_id">Empresa *</label>
        <select id="empresa_id" formControlName="empresa_id">
            <option [ngValue]="null" disabled>Seleccione una empresa</option>
            <option *ngFor="let empresa of empresas" [ngValue]="empresa.empresa_id">
                {{ empresa.empresa_nombre }}
            </option>
        </select>
        <span class="error"
            *ngIf="evaluationForm.get('empresa_id')?.touched && evaluationForm.get('empresa_id')?.invalid">
            Debes seleccionar una empresa.
        </span>
    </div>

    <div class="form-message error" *ngIf="serverError">
        {{ serverError }}
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary"
            [disabled]="evaluationForm.invalid || loadingEmpresas || submitting">
            {{ submitting ? 'Guardando...' : (evaluacionToEdit ? 'Guardar cambios' : 'Crear evaluación') }}
        </button>
    </div>
</form>

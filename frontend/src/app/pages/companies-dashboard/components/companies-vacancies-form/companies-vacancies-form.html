<form [formGroup]="vacanteForm" (ngSubmit)="onSubmit()" class="form-container">
  <h2>{{ vacanteToEdit ? 'Editar Vacante' : 'Nueva Vacante' }}</h2>

  <div class="form-group">
    <label for="vacante_nombre">Nombre de la Vacante *</label>
    <input id="vacante_nombre" type="text" formControlName="vacante_nombre" placeholder="Ej. Desarrollador Frontend Senior" />
    <span class="error" *ngIf="vacanteForm.get('vacante_nombre')?.touched && vacanteForm.get('vacante_nombre')?.invalid">
      El nombre de la vacante es obligatorio.
    </span>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="tipo_jornada">Tipo de Jornada *</label>
      <select id="tipo_jornada" formControlName="tipo_jornada" class="form-control">
        <option value="Tiempo Completo">Tiempo Completo</option>
        <option value="Medio Tiempo">Medio Tiempo</option>
        <option value="Freelance">Freelance</option>
        <option value="Temporal">Temporal</option>
      </select>
    </div>

    <div class="form-group">
      <label for="salario">Salario (Q)</label>
      <input id="salario" type="number" formControlName="salario" placeholder="Ej. 5000" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="categoria">Categoría</label>
      <input id="categoria" type="text" formControlName="categoria" placeholder="Ej. Tecnología / IT" />
    </div>

    <div class="form-group">
      <label for="ubicacion">Ubicación</label>
      <input id="ubicacion" type="text" formControlName="ubicacion" placeholder="Ej. Ciudad de Guatemala / Remoto" />
    </div>
  </div>

  <div class="form-group">
    <label for="habilidades_requeridas">Habilidades Requeridas</label>
    <textarea id="habilidades_requeridas" formControlName="habilidades_requeridas" rows="2" placeholder="Ej. Angular, TypeScript, RxJS, CSS"></textarea>
  </div>

  <div class="form-group">
    <label for="vacante_descripcion">Descripción del Puesto</label>
    <textarea id="vacante_descripcion" formControlName="vacante_descripcion" rows="4" placeholder="Detalles de las responsabilidades y beneficios..."></textarea>
  </div>

  <div class="form-group checkbox-group">
    <label>
      <input type="checkbox" formControlName="estado" />
      Vacante Activa (Disponible)
    </label>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="vacanteForm.invalid">Guardar Vacante</button>
  </div>
</form>

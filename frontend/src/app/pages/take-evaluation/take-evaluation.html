<div class="evaluation-container">

  <!-- ESTADO DE CARGA -->
  <section *ngIf="cargando" class="welcome-card">
    <p>Cargando evaluación...</p>
  </section>

  <!-- ESTADO DE ERROR AL CARGAR -->
  <section *ngIf="!cargando && errorCarga" class="welcome-card">
    <p class="hint-text">{{ errorCarga }}</p>
    <button type="button" class="btn btn-primary" (click)="volverAlHome()">Volver al inicio</button>
  </section>

  <!-- A PARTIR DE AQUÍ: TUS 3 SECCIONES ORIGINALES, cada *ngIf ahora también exige !cargando && !errorCarga -->

  <!-- VISTA 1: BIENVENIDA / INICIO -->
  <section class="take-evaluation-page" *ngIf="!cargando && !errorCarga && estado === 'welcome'">
    <!-- ... contenido igual que ya tenías ... -->
  </section>

  <!-- VISTA 2: CUESTIONARIO / PREGUNTAS -->
  <section class="quiz-page" *ngIf="!cargando && !errorCarga && estado === 'quiz'">
    <header class="quiz-header">
      <h2>{{ evaluationName }}</h2>
      <span class="quiz-badge">Puntaje mínimo requerido: {{ requiredScore }}%</span>
    </header>

    <div class="questions-list">
      <div class="question-card" *ngFor="let pregunta of preguntas; let i = index">
        <h4 class="question-title">Pregunta {{ i + 1 }} de {{ preguntas.length }}</h4>
        <p class="question-text">{{ pregunta.enunciado }}</p>

        <div class="options-group">
          <label *ngFor="let opcion of pregunta.opciones; let j = index" class="option-item"
            [class.selected]="pregunta.respuestaSeleccionada === j">
            <input type="radio" [name]="'pregunta_' + i" [value]="j" (change)="seleccionarRespuesta(i, j)">
            <span>{{ opcion.texto }}</span>
          </label>
        </div>
      </div>
    </div>

    <div class="quiz-footer">
      <p *ngIf="errorEnvio" class="hint-text" style="color: #f87171;">{{ errorEnvio }}</p>
      <button type="button" class="btn btn-success" [disabled]="!todasRespondidas() || enviando"
        (click)="finalizarEvaluacion()">
        {{ enviando ? 'Enviando...' : 'Finalizar y Enviar Evaluación' }}
      </button>
      <p *ngIf="!todasRespondidas()" class="hint-text">Responde todas las preguntas para enviar tu examen.</p>
    </div>
  </section>

  <!-- VISTA 3: RESULTADOS -->
  <section class="result-page" *ngIf="!cargando && !errorCarga && estado === 'result'">
    <!-- ... contenido igual que ya tenías ... -->
  </section>

</div>

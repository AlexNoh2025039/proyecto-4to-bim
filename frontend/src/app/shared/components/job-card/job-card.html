<div class="job-card">
  <div class="job-header">
    <div>
      <h3 class="job-title">{{ vacante.vacante_nombre }}</h3>
    </div>
    <span class="job-badge" [ngClass]="{'active': vacante.estado, 'inactive': !vacante.estado}">
      {{ vacante.estado ? 'Activa' : 'Inactiva' }}
    </span>
  </div>

  <p class="job-description" *ngIf="vacante.vacante_descripcion">
    {{ vacante.vacante_descripcion }}
  </p>

  <p class="job-skills" *ngIf="vacante.habilidades_requeridas">
    <strong>Requisitos:</strong> {{ vacante.habilidades_requeridas }}
  </p>

  <div class="job-details">
    <span class="detail-item" *ngIf="vacante.ubicacion">
      Ubicacion: {{ vacante.ubicacion }}
    </span>
    <span class="detail-item" *ngIf="vacante.tipo_jornada">
      Jornada: {{ vacante.tipo_jornada }}
    </span>
    <span class="detail-item" *ngIf="vacante.salario">
      Salario: Q{{ vacante.salario | number:'1.2-2' }}
    </span>
  </div>

  <div class="job-actions">
    <a [routerLink]="['/job-detail', vacante.vacante_id]" class="btn btn-primary">
      Ver detalle
    </a>

    <div *ngIf="isCompanyOwner" class="owner-actions">
      <button (click)="onEdit()" class="btn btn-secondary">Editar</button>
      <button (click)="onDelete()" class="btn btn-danger">Eliminar</button>
    </div>
  </div>
</div>

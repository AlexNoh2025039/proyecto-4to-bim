<article class="notification-card" [class.is-read]="notificacion.estado">
    <div class="notification-header">
        <div>
            <span class="notification-type">{{ notificacion.tipo }}</span>
            <h3>{{ notificacion.titulo }}</h3>
        </div>

        <label class="checkbox-read" title="Marcar como leída">
            <input type="checkbox" [checked]="notificacion.estado" (change)="onToggleRead()" />
            <span>Leída</span>
        </label>
    </div>

    <p class="notification-description" *ngIf="notificacion.descripcion">
        {{ notificacion.descripcion }}
    </p>

    <div class="notification-footer" *ngIf="notificacion.fecha">
        <span>{{ notificacion.fecha | date:'dd/MM/yyyy HH:mm' }}</span>
    </div>
</article>
